<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gamifikasi Area Perishable Indogrosir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,600;1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#005CAB;--blueD:#003E78;--red:#E31E24;--redD:#A61116;--lime:#AFE24D;--limeD:#6FA524;
  --gold:#FFC928;--goldD:#C79400;--ink:#1A253A;--green:#2FB344;--orange:#FF7A1A;
  --fd:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  --fn:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);--smooth:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;overflow:hidden;background:#071936;height:100%}
body{font-family:var(--fn);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font-family:inherit;border:0;cursor:pointer;color:inherit;background:none;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text;font-family:inherit}

/* ---------- Frame & Scaling ---------- */
#app{position:relative;width:100%;height:600px;overflow:hidden;
  background:radial-gradient(110% 70% at 15% 0%,#0E4B8F 0%,transparent 55%),radial-gradient(90% 60% at 100% 100%,rgba(227,30,36,.28) 0%,transparent 60%),#071936}
#app::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 2px,transparent 2.5px);background-size:28px 28px}
#stage{position:absolute;left:50%;top:50%;width:720px;height:1280px;overflow:hidden;background:#DCE6F2;transform:translate(-50%,-50%);transform-origin:50% 50%}
#stage.framed{border-radius:32px;box-shadow:0 30px 90px rgba(0,0,0,.55)}
#bgLayer{position:absolute;inset:0;z-index:1;overflow:hidden}
.bgScene{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .75s var(--smooth),transform 1.1s var(--smooth);transform:scale(1.04)}
.bgScene.active{opacity:1;transform:scale(1)}
#stage.blurBG #bgLayer{filter:blur(5px) brightness(.88);transition:filter .55s}
#bgLayer{transition:filter .55s}

#vig{position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse 85% 75% at 50% 45%,transparent 48%,rgba(6,15,38,.48) 100%);opacity:0;transition:opacity .8s}
#vig.on{opacity:1}
#actors{position:absolute;inset:0;z-index:4;pointer-events:none}
#workstation{position:absolute;inset:0;z-index:5;pointer-events:none}
#workstation.active{pointer-events:auto}
#fx{position:absolute;inset:0;z-index:7;pointer-events:none}
#hud{position:absolute;left:0;right:0;top:0;height:108px;z-index:8;display:flex;align-items:center;gap:12px;padding:16px 118px 12px 20px;pointer-events:none;transition:transform .6s var(--smooth),opacity .5s}
#hud.hide{transform:translateY(-140%);opacity:0}
#ui{position:absolute;inset:0;z-index:9;pointer-events:none}
#ui>*{pointer-events:auto}
#ui>.passive{pointer-events:none}
#warnOverlay{position:absolute;inset:0;z-index:16;pointer-events:none}
#wipe{position:absolute;inset:0;z-index:20;pointer-events:none;background:linear-gradient(135deg,#004A8F,#071936);opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
#wipe.on{pointer-events:auto}

/* ---------- BGM & Copyright ---------- */
#bgmBtn{position:absolute;right:20px;top:16px;z-index:19;width:84px;height:76px;border-radius:22px;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.16);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .15s,box-shadow .15s}
#bgmBtn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.16)}
#bgmBtn svg{width:40px;height:32px}
#bgmBtn span{font:800 12px var(--fn);letter-spacing:1px;color:var(--blue)}
#bgmBtn.off span{color:#9AA3B5}
#bgmBtn .eq rect{transform-box:fill-box;transform-origin:50% 100%;animation:eq .75s ease-in-out infinite alternate}
#bgmBtn .eq rect:nth-child(2){animation-delay:.22s}#bgmBtn .eq rect:nth-child(3){animation-delay:.45s}
@keyframes eq{0%{transform:scaleY(.28)}100%{transform:scaleY(1)}}
#bgmBtn.off .eq{display:none}#bgmBtn .x{display:none}#bgmBtn.off .x{display:inline}
#copy{position:absolute;left:0;right:0;bottom:10px;text-align:center;z-index:19;pointer-events:none}
#copy span{display:inline-block;font:600 14px var(--fn);color:rgba(255,255,255,.92);background:rgba(8,22,52,.52);padding:4px 14px;border-radius:999px;backdrop-filter:blur(4px)}

/* ---------- HUD ---------- */
.hBadge{display:flex;align-items:center;gap:12px;background:#fff;border-radius:22px;height:76px;padding:0 20px 0 14px;box-shadow:0 6px 0 rgba(0,0,0,.14)}
.hBadge .ic{width:48px;height:48px;border-radius:14px;background:var(--blue);color:#fff;display:grid;place-items:center;font:800 24px var(--fd)}
.hBadge b{display:block;font:800 24px/1.05 var(--fd);color:var(--ink)}
.hBadge small{display:block;font:700 13px var(--fn);color:#6E7A94;letter-spacing:.8px;text-transform:uppercase;margin-top:3px}
.hProg{margin-left:auto;display:flex;align-items:center;gap:8px;background:#fff;border-radius:22px;height:76px;padding:0 16px;box-shadow:0 6px 0 rgba(0,0,0,.14)}
.hDot{width:36px;height:36px;border-radius:50%;background:#E6ECF5;display:grid;place-items:center;font:800 16px var(--fd);color:#8C97B0;transition:all .35s var(--spring)}
.hDot.cur{background:var(--gold);color:var(--ink);transform:scale(1.14);box-shadow:0 0 0 4px rgba(255,201,40,.35)}
.hDot.done{background:var(--green);color:#fff}

/* ---------- Character Rig & Animations ---------- */
.actor{position:absolute;transform-origin:50% 100%;transition:filter .4s,opacity .4s,transform .55s var(--smooth)}
.actor .rig{width:100%;height:auto;display:block;overflow:visible}
.actor.dim{filter:brightness(.82) saturate(.85)}
.rig .upper{transform-box:view-box;transform-origin:182px 470px;animation:rBreath 3.2s ease-in-out infinite}
@keyframes rBreath{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(2px) scaleY(.993)}}
.rig .head{transform-box:view-box;transform-origin:182px 195px;animation:rTilt 5.8s ease-in-out infinite;transition:transform .4s}
@keyframes rTilt{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.4deg)}}
.rig .pony{transform-box:fill-box;transform-origin:15% 25%;animation:rPony 3.2s ease-in-out infinite}
@keyframes rPony{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(4deg)}}
.rig .eyes{transform-box:view-box;transform-origin:182px 122px;animation:rBlink 4.2s infinite}
@keyframes rBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.06)}98%{transform:scaleY(1)}}
.rig .vg>g{opacity:0;transition:opacity .12s}
.rig .vg>g.on{opacity:1}
.rig .talkM{opacity:0;transform-box:view-box;transform-origin:182px 158px}
.rig.talking .mouth{opacity:0}
.rig.talking .talkM{opacity:1;animation:rTalk .17s ease-in-out infinite alternate}
@keyframes rTalk{from{transform:scale(1,.2)}to{transform:scale(1,1.05)}}
.rig.talking .head{animation:rTalkH .38s ease-in-out infinite alternate}
@keyframes rTalkH{from{transform:rotate(-1.5deg) translateY(0)}to{transform:rotate(1.5deg) translateY(-2.5px)}}
.rig .arm,.rig .fore{transform-box:view-box;transition:transform .5s cubic-bezier(.34,1.35,.5,1)}
.rig .hand.open{display:none}
.rig .openH>.fore>.hand.open{display:inline}
.rig .openH>.fore>.hand.fist{display:none}
.rig[data-pose=wave] .armR .fore{animation:rWave .55s ease-in-out .3s infinite alternate}
@keyframes rWave{from{transform:rotate(24deg)}to{transform:rotate(52deg)}}
.rig[data-pose=pump] .armR{animation:rPump .42s ease-in-out .3s infinite alternate}
@keyframes rPump{from{transform:rotate(26deg)}to{transform:rotate(10deg)}}
.rig.walking .legL{animation:rLeg .45s ease-in-out infinite alternate}
.rig.walking .legR{animation:rLeg .45s ease-in-out infinite alternate-reverse}
@keyframes rLeg{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}

/* ---------- Dialog Box ---------- */
.dlg{position:absolute;left:22px;right:22px;bottom:52px;min-height:220px;background:#fff;border-radius:32px;padding:48px 32px 36px;
  box-shadow:0 12px 0 rgba(10,30,68,.16),0 26px 60px rgba(8,18,48,.35);font:600 29px/1.44 var(--fn);color:var(--ink)}
.dlg .tag{position:absolute;left:24px;top:-30px;display:flex;align-items:center;gap:10px;padding:6px 22px 6px 6px;border-radius:999px;background:var(--c,var(--blue));color:#fff;
  font:800 25px var(--fd);box-shadow:0 5px 0 rgba(0,0,0,.16)}
.dlg .tag .av{width:52px;height:52px;border-radius:50%;background:#fff;overflow:hidden;flex:none;border:2px solid #fff}
.dlg .tag .av svg{width:100%;height:100%;display:block}
.dlg .tag em{font:700 14px var(--fn);font-style:normal;background:rgba(255,255,255,.24);padding:3px 10px;border-radius:999px;letter-spacing:.5px}
.dlg .next{position:absolute;right:26px;bottom:14px;font:800 20px var(--fd);color:var(--blue);opacity:0;transition:opacity .25s}
.dlg .next.show{opacity:1;animation:nudge .75s ease-in-out infinite alternate}
@keyframes nudge{to{transform:translateY(5px)}}
.dlg b.hl{color:var(--blue);font-weight:800}
.dlg b.red{color:var(--red);font-weight:800}
.ch{opacity:0;transition:opacity .08s}.ch.on{opacity:1}

/* ---------- Title & Screens ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;pointer-events:auto}
.titleHero{position:absolute;left:28px;right:28px;top:110px;display:flex;flex-direction:column;align-items:center;text-align:center}
.igrLogoBox{background:#fff;padding:14px 28px;border-radius:24px;box-shadow:0 10px 0 rgba(0,0,0,.18),0 20px 50px rgba(0,0,0,.3);margin-bottom:22px;border:4px solid var(--blue)}
.igrLogoBox svg{width:310px;height:78px;display:block}
.kicker{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:var(--ink);font:800 20px var(--fd);padding:7px 20px;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.2);letter-spacing:1px;text-transform:uppercase}
.mainTtl{font:800 64px/1.04 var(--fd);color:#fff;margin-top:16px;text-shadow:0 6px 0 #002F5E,0 14px 30px rgba(0,0,0,.45);letter-spacing:-1px}
.mainTtl span{display:block;color:var(--gold);font-size:74px;margin-top:4px}
.subTtl{font:700 24px/1.35 var(--fn);color:#EBF4FF;margin-top:14px;background:rgba(0,45,92,.65);padding:10px 24px;border-radius:999px;backdrop-filter:blur(4px)}
.tapStartWrap{position:absolute;left:40px;right:40px;bottom:82px;display:flex;flex-direction:column;align-items:center;gap:14px}
.tapStartBtn{width:100%;height:98px;border-radius:32px;background:linear-gradient(180deg,#FFE055,var(--gold));color:var(--ink);font:800 32px var(--fd);
  box-shadow:0 10px 0 var(--goldD),0 22px 50px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;gap:14px;animation:pulseBtn 1.5s ease-in-out infinite}
@keyframes pulseBtn{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.tapStartBtn:active{transform:translateY(6px);box-shadow:0 3px 0 var(--goldD)}

/* ---------- Gender & Name Selection ---------- */
.selHeader{position:absolute;left:30px;right:30px;top:118px;text-align:center;color:#fff}
.selHeader h2{font:800 50px/1.08 var(--fd);text-shadow:0 5px 0 rgba(0,25,60,.45)}
.selHeader p{font:600 24px/1.35 var(--fn);opacity:.92;margin-top:8px}
.avCards{position:absolute;left:28px;right:28px;top:275px;display:flex;gap:22px}
.avCard{position:relative;flex:1;height:520px;border-radius:36px;background:rgba(255,255,255,.95);overflow:hidden;box-shadow:0 10px 0 rgba(0,0,0,.16),0 24px 50px rgba(0,0,0,.28);transition:all .35s var(--spring)}
.avCard .bgp{position:absolute;inset:0;background:radial-gradient(75% 55% at 50% 38%,#E6F2FF,#C7DDF7)}
.avCard .rigw{position:absolute;left:-6%;right:-6%;top:24px}
.avCard .nm{position:absolute;left:0;right:0;bottom:0;height:96px;display:flex;align-items:center;justify-content:center;background:#fff;font:800 38px var(--fd);color:var(--ink)}
.avCard .chk{position:absolute;right:16px;top:16px;width:56px;height:56px;border-radius:50%;background:var(--gold);display:grid;place-items:center;transform:scale(0);transition:transform .35s var(--spring);box-shadow:0 4px 0 var(--goldD);font:800 28px var(--fd)}
.avCard.sel{transform:translateY(-10px) scale(1.025);box-shadow:0 0 0 7px var(--gold),0 16px 0 rgba(0,0,0,.18),0 28px 60px rgba(0,0,0,.35)}
.avCard.sel .chk{transform:scale(1)}
.avCard.sel .nm{background:var(--gold);color:var(--ink)}
.nameBox{position:absolute;left:28px;right:28px;bottom:68px;background:#fff;border-radius:34px;padding:26px 28px 28px;box-shadow:0 12px 0 rgba(0,0,0,.16),0 26px 60px rgba(0,0,0,.32)}
.nameBox label{display:block;font:800 24px var(--fd);color:var(--ink);margin-bottom:10px}
.nmRow{display:flex;align-items:center;gap:10px;border:4px solid #D5DFEE;border-radius:22px;padding:6px 12px;background:#F5F8FC;transition:border-color .2s}
.nmRow:focus-within{border-color:var(--blue);background:#fff}
.nmRow .pre{background:var(--blue);color:#fff;font:800 24px var(--fd);padding:12px 18px;border-radius:16px}
.nmRow input{flex:1;min-width:0;height:66px;border:0;outline:none;background:transparent;font:700 30px var(--fn);color:var(--ink)}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:86px;border-radius:26px;background:var(--blue);color:#fff;font:800 30px var(--fd);
  box-shadow:0 8px 0 var(--blueD);transition:transform .12s,box-shadow .12s,opacity .2s;margin-top:18px}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--blueD)}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 8px 0 var(--goldD)}
.btn.gold:active{box-shadow:0 2px 0 var(--goldD)}
.btn.lime{background:var(--lime);color:var(--ink);box-shadow:0 8px 0 var(--limeD)}
.btn[disabled]{filter:grayscale(.85);opacity:.55;pointer-events:none}

/* ---------- Choice Overlay ---------- */
.chBack{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,18,44,0) 25%,rgba(8,18,44,.78) 65%,rgba(8,18,44,.9));pointer-events:auto}
.chWrap{position:absolute;left:26px;right:26px;bottom:60px;display:flex;flex-direction:column;gap:16px}
.chPrompt{align-self:center;text-align:center;background:var(--gold);color:var(--ink);font:800 26px/1.25 var(--fd);padding:12px 26px;border-radius:22px;box-shadow:0 6px 0 rgba(0,0,0,.22)}
.choice{display:flex;gap:16px;align-items:center;width:100%;background:#fff;border-radius:26px;padding:20px 24px;font:700 25px/1.36 var(--fn);text-align:left;color:var(--ink);
  box-shadow:0 8px 0 #C4CFDC,0 14px 34px rgba(0,0,0,.28);transition:transform .12s}
.choice:active{transform:translateY(6px)}
.choice .k{flex:none;width:56px;height:56px;border-radius:18px;background:#EAF2FF;color:var(--blue);display:grid;place-items:center;font:800 26px var(--fd)}

/* ---------- Instruction Pill ---------- */
.instr{position:absolute;left:50%;top:122px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;font:700 22px var(--fn);
  padding:10px 24px 10px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 7px 0 rgba(0,0,0,.22);z-index:12;pointer-events:none}
.instr i{width:38px;height:38px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font:800 20px var(--fd);color:var(--ink);font-style:normal}

/* ---------- Workstation (Fruit & Butcher) ---------- */
.wsWrap{position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:auto}
.wsBench{position:absolute;left:0;right:0;top:185px;bottom:0;background:linear-gradient(180deg,#D7E0EC 0%,#B8C4D4 18%,#94A3B8 100%);border-top:8px solid #F1F5F9;box-shadow:0 -20px 50px rgba(0,0,0,.35)}
.wsBench::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 2px,transparent 2px 80px)}

/* Top Equipment Shelf: Tray, Plastic Wrap, Digital Scale */
.equipRow{position:absolute;left:18px;right:18px;top:205px;height:230px;display:flex;gap:14px;align-items:stretch;z-index:2}
.eqSlot{flex:1;background:rgba(255,255,255,.78);border-radius:24px;border:3px solid #fff;box-shadow:0 8px 0 rgba(15,35,65,.12);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 10px 12px;position:relative;transition:all .3s var(--spring)}
.eqSlot.highlight{box-shadow:0 0 0 5px var(--gold),0 10px 24px rgba(0,0,0,.22);background:#FFFDF2;animation:slotPulse 1.1s ease-in-out infinite alternate}
@keyframes slotPulse{to{transform:translateY(-5px)}}
.eqSlot .eqLbl{font:800 15px var(--fd);color:#475569;text-transform:uppercase;letter-spacing:.6px;background:#E2E8F0;padding:4px 12px;border-radius:999px}
.eqSlot.scaleSlot{flex:1.25;background:linear-gradient(180deg,#F8FAFC,#E2E8F0)}

/* Cutting Board */
.boardArea{position:absolute;left:34px;right:34px;top:460px;height:520px;background:#FDFDFD;border-radius:38px;
  box-shadow:0 16px 0 #CBD5E1,0 28px 60px rgba(0,0,0,.28),inset 0 0 0 6px #F1F5F9;display:flex;align-items:center;justify-content:center;overflow:hidden;z-index:3}
.boardGroove{position:absolute;inset:20px;border:3px solid #E2E8F0;border-radius:26px;pointer-events:none}
.boardBadge{position:absolute;left:28px;top:24px;font:800 18px var(--fd);color:#64748B;background:#F1F5F9;padding:6px 16px;border-radius:999px;letter-spacing:.5px}
.stepCounter{position:absolute;right:28px;top:24px;font:800 18px var(--fd);color:var(--blue);background:#E0F2FE;padding:6px 16px;border-radius:999px}

/* Bottom PLU Info Bar */
.pluRefBar{position:absolute;left:34px;right:34px;bottom:68px;height:145px;background:#1E293B;border-radius:28px;padding:14px 22px;color:#fff;
  box-shadow:0 10px 0 #0F172A,0 20px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;justify-content:center;gap:10px;z-index:3}
.pluRefBar .prTitle{font:800 16px var(--fd);color:var(--gold);letter-spacing:1px;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between}
.pluChips{display:flex;gap:10px}
.pluChip{flex:1;background:rgba(255,255,255,.09);border:2px solid rgba(255,255,255,.15);border-radius:16px;padding:8px 10px;text-align:center;transition:all .25s}
.pluChip.active{background:rgba(255,201,40,.22);border-color:var(--gold);transform:scale(1.04)}
.pluChip small{display:block;font:700 13px var(--fn);color:#CBD5E1}
.pluChip b{display:block;font:800 24px var(--fd);color:#fff;letter-spacing:1.5px;margin-top:2px}
.pluChip.active b{color:var(--gold)}

/* Slice Guide Line & Knife Cursor */
.guideSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.guideLine{stroke:#E31E24;stroke-width:7;stroke-dasharray:16 12;stroke-linecap:round;fill:none;filter:drop-shadow(0 2px 6px rgba(227,30,36,.5));animation:dashMove 1s linear infinite}
@keyframes dashMove{to{stroke-dashoffset:-28}}
.guideStart,.guideEnd{transition:transform .2s}
.guideHand{position:absolute;width:68px;height:68px;pointer-events:none;z-index:8;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.slashTrail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:7}

/* Draggable Items */
.dragProxy{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%) scale(1.08);filter:drop-shadow(0 18px 28px rgba(0,0,0,.35))}
.draggable{cursor:grab;touch-action:none}
.draggable:active{cursor:grabbing}

/* Digital Scale Keypad Modal */
.keypadModal{position:absolute;inset:0;background:rgba(10,20,45,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:14}
.scaleMachine{width:610px;background:linear-gradient(180deg,#F8FAFC,#E2E8F0);border-radius:38px;padding:28px;border:5px solid #fff;box-shadow:0 18px 0 #94A3B8,0 35px 80px rgba(0,0,0,.5)}
.scHead{display:flex;align-items:center;justify-content:space-between;background:#0F172A;color:#fff;padding:16px 22px;border-radius:22px;border:4px solid #334155}
.scLcd{font-family:monospace;text-align:right}
.scLcd .lTop{font:700 16px var(--fn);color:#38BDF8;letter-spacing:1px}
.scLcd .lMain{font:800 44px/1.1 var(--fd);color:#4ADE80;letter-spacing:3px;margin-top:4px}
.scTargetHint{margin:14px 0;background:#FEF9C3;border:2px dashed #EAB308;border-radius:16px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;font:700 19px var(--fn);color:#713F12}
.scTargetHint b{font:800 25px var(--fd);color:#B45309;letter-spacing:1.5px}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.numBtn{height:76px;border-radius:20px;background:#fff;font:800 32px var(--fd);color:var(--ink);box-shadow:0 6px 0 #CBD5E1;transition:transform .1s,box-shadow .1s}
.numBtn:active{transform:translateY(5px);box-shadow:0 1px 0 #CBD5E1}
.numBtn.clr{background:#FEE2E2;color:var(--red);box-shadow:0 6px 0 #FCA5A5;font-size:24px}
.numBtn.ok{background:var(--green);color:#fff;box-shadow:0 6px 0 #15803D;font-size:24px}

/* Warning Banner (Rosi Pop-up) */
.rosiWarn{position:absolute;left:26px;right:26px;top:130px;background:#FFF1F2;border:5px solid var(--red);border-radius:30px;padding:18px 22px;
  display:flex;align-items:center;gap:16px;box-shadow:0 14px 0 rgba(166,17,22,.25),0 25px 60px rgba(0,0,0,.4);z-index:18}
.rosiWarn .rwAv{width:84px;height:84px;border-radius:50%;background:#fff;border:4px solid var(--red);overflow:hidden;flex:none}
.rosiWarn .rwAv svg{width:100%;height:100%}
.rosiWarn .rwTxt b{display:block;font:800 22px var(--fd);color:var(--red)}
.rosiWarn .rwTxt p{font:700 21px/1.32 var(--fn);color:var(--ink);margin-top:4px}

/* Flash Merah Transparan saat salah (layar TIDAK bergeser) */
#errFlash{position:absolute;inset:0;z-index:15;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse 85% 75% at 50% 50%,rgba(227,30,36,.20) 0%,rgba(227,30,36,.38) 55%,rgba(190,10,20,.62) 100%)}
#errFlash.on{animation:errFlash .8s ease-out}
@keyframes errFlash{0%{opacity:0}12%{opacity:1}30%{opacity:.5}48%{opacity:.9}100%{opacity:0}}

/* Butcher Guide Diagram Card */
.cutGuideBar{position:absolute;left:34px;right:34px;top:205px;height:230px;background:#fff;border-radius:28px;padding:16px 22px;
  box-shadow:0 10px 0 #CBD5E1,0 20px 40px rgba(0,0,0,.2);display:flex;align-items:center;gap:20px;z-index:3;border:4px solid var(--blue)}
.cutTargetBadge{width:155px;height:190px;border-radius:22px;background:linear-gradient(180deg,var(--blue),var(--blueD));color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;flex:none;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2)}
.cutTargetBadge small{font:800 14px var(--fd);color:var(--gold);letter-spacing:1px}
.cutTargetBadge b{font:800 64px/1 var(--fd);margin:6px 0}
.cutTargetBadge span{font:700 18px var(--fn);opacity:.95}
.cutRules{flex:1;display:flex;flex-direction:column;gap:8px}
.cutRules h4{font:800 22px var(--fd);color:var(--ink)}
.cutRules p{font:600 19px/1.38 var(--fn);color:#475569}
.cutStepList{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.cutStepPill{font:700 15px var(--fn);background:#F1F5F9;color:#475569;padding:5px 12px;border-radius:999px;border:2px solid #E2E8F0}
.cutStepPill.cur{background:#FEF3C7;color:#B45309;border-color:var(--gold);font-weight:800}
.cutStepPill.done{background:#DCFCE7;color:#15803D;border-color:#86EFAC}

/* Particles & Confetti */
.juiceDrop{position:absolute;border-radius:50%;pointer-events:none}
.floatT{position:absolute;font:800 30px var(--fd);white-space:nowrap;pointer-events:none;text-shadow:0 3px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff;z-index:15}
.conf{position:absolute;left:0;top:0;width:14px;height:22px;border-radius:3px}

/* Ending Card */
.endCard{position:absolute;left:32px;right:32px;bottom:56px;background:#fff;border-radius:38px;padding:30px 30px 28px;
  box-shadow:0 14px 0 rgba(0,0,0,.18),0 30px 70px rgba(0,0,0,.4);text-align:center}
.scoreRow{display:flex;gap:12px;margin:16px 0}
.scoreBox{flex:1;background:#F1F7FF;border-radius:22px;padding:14px 10px;border:2px solid #D8E8FF}
.scoreBox b{display:block;font:800 28px var(--fd);color:var(--blue)}
.scoreBox small{display:block;font:700 15px var(--fn);color:#5A6B88;margin-top:2px}

#ui>.instr{pointer-events:none}
.instr{border-radius:30px;width:max-content;max-width:640px;line-height:1.3;text-align:left}
.stepCounter{font-size:16px}
.boardArea,.wsWrap,.keypadModal{touch-action:none}
.cutGuideBar{top:198px;height:252px;padding:12px 20px;gap:16px}
.cutTargetBadge{height:214px;width:140px}
.cutRules{gap:6px;min-width:0}
.cutRules h4{font-size:20px}.cutRules p{font-size:16px;line-height:1.3}
.cutStepList{flex-wrap:nowrap;gap:6px}
.cutStepPill{min-width:36px;text-align:center;padding:5px 6px;font-size:16px}
.curLbl{font:800 20px/1.25 var(--fn);color:var(--blue);background:#E0F2FE;border-radius:14px;padding:8px 12px}
.dlg .tag .av img,.rosiWarn .rwAv img{width:100%;height:100%;object-fit:cover;display:block}
.chr{position:relative;width:100%;display:block;pointer-events:none;-webkit-user-select:none;user-select:none;filter:drop-shadow(0 12px 18px rgba(0,0,0,.35));transform-origin:50% 100%}
.chr::before{content:'';display:block;padding-top:185.37%}
.chr .cAll{position:absolute;inset:0;transform-origin:50% 100%}
.chr .cp{position:absolute;will-change:transform}
.chr .cp img{width:100%;height:100%;display:block;-webkit-user-drag:none}
.chr .cHead svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.chr.walking{animation:rWalkB .36s ease-in-out infinite alternate}
@keyframes rWalkB{to{transform:translateY(-16px) rotate(1.6deg)}}
.igrLogoBox svg{width:440px;height:auto}
.titleRosi{position:absolute;left:calc(50% - 175px);bottom:6px;width:350px;pointer-events:none}
.tapStartWrap{z-index:2}
@media (hover:none) and (pointer:coarse){.screen.typing .nameBox{transform:translateY(-440px)}.screen.typing .avCards,.screen.typing .selHeader{opacity:.25}}
.nameBox,.avCards,.selHeader{transition:transform .3s var(--smooth),opacity .3s}

#dlgLayer{position:absolute;inset:0;z-index:6;pointer-events:none}
#dlgLayer>*{pointer-events:auto}
/* ===== v3: judul, layer teks, hasil potongan ===== */
#ui{z-index:3}
.titleHero{left:22px;right:22px;top:60px}
.titleRosi{bottom:-48px}
.boardBadge,.stepCounter{z-index:4}
.mainTtl{margin-top:18px;width:100%;box-sizing:border-box;padding:20px 20px 24px;border-radius:34px;
  background:linear-gradient(180deg,#005CAB 0%,#003A73 100%);border:6px solid var(--gold);
  box-shadow:0 10px 0 #002F5E,0 22px 44px rgba(0,0,0,.45),inset 0 0 0 3px rgba(255,255,255,.18);
  font-size:56px;text-shadow:0 4px 0 #002F5E}
.mainTtl span{font-size:60px;white-space:nowrap;margin-top:6px;text-shadow:0 4px 0 #6B4B00}
.subTtl{margin-top:22px;width:100%;box-sizing:border-box;text-align:center;padding:14px 8px;border-radius:26px;
  background:#00346B;border:4px solid #fff;color:#fff;font-size:20.5px;white-space:nowrap;
  box-shadow:0 8px 0 #001E40,0 16px 34px rgba(0,0,0,.4);backdrop-filter:none}
.resOv{position:absolute;inset:0;background:rgba(6,15,38,.78);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;pointer-events:auto;z-index:30;touch-action:none}
.resCard{width:640px;box-sizing:border-box;background:#fff;border-radius:36px;border:6px solid var(--blue);padding:0 24px 24px;
  box-shadow:0 14px 0 #003A73,0 30px 70px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;position:relative}
.resTag{margin-top:-34px;background:linear-gradient(180deg,#FFE055,var(--gold));color:var(--ink);font:800 26px var(--fd);padding:10px 30px;border-radius:999px;box-shadow:0 6px 0 rgba(0,0,0,.25);letter-spacing:.5px;text-align:center}
.resImg{margin-top:18px;width:520px;height:520px;border-radius:26px;border:4px solid #E2E8F0;background:#fff;overflow:hidden;box-shadow:inset 0 0 0 2px #F8FAFC}
.resImg img{width:100%;height:100%;object-fit:contain;display:block}
.resCap{margin-top:16px;width:100%;box-sizing:border-box;background:#EAF4FF;border:3px solid #BBD7F5;border-radius:24px;padding:14px 18px;text-align:center}
.resChips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.resChips span{background:var(--blue);color:#fff;font:800 20px var(--fd);padding:6px 16px;border-radius:999px}
.resChips span b{color:var(--gold)}
.resCap p{font:700 19px/1.35 var(--fn);color:var(--ink);margin-top:10px}
.resBtn{margin-top:18px;width:100%;height:92px;border-radius:30px;cursor:pointer;background:linear-gradient(180deg,#D9FBE4,#9CF0B8);border:5px solid #4ADE80;color:#0B3D1E;
  font:800 38px var(--fd);letter-spacing:.5px;box-shadow:0 9px 0 #22A455,0 18px 30px rgba(0,0,0,.3);animation:resPulse 1s ease-in-out infinite alternate}
.resBtn:active{transform:translateY(7px);box-shadow:0 2px 0 #22A455}
@keyframes resPulse{to{transform:scale(1.035)}}
.chImg{position:absolute;left:50%;top:50%;width:520px;height:520px;transform:translate(-50%,-50%);border-radius:50%;object-fit:cover;pointer-events:none;-webkit-user-drag:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
</style>
</head>

    const hw=46*w,Lx=CX-hw,Rx=CX+hw,Ly=375-(1-w)*6,Ry=362+(1-w)*6,depth=o*36;

    return {shape:`${top} Q${CX},${(397+2*depth).toFixed(1)} ${Lx.toFixed(1)},${Ly.toFixed(1)} Z`,hide:top,
      teeth:`${top} L${Rx.toFixed(1)},${(Ry+12).toFixed(1)} Q${CX},409 ${Lx.toFixed(1)},${(Ly+12).toFixed(1)} Z`,tongueY:383+depth*.9};
  }
  function tick(now){
    const dt=Math.min(.05,(now-(last||now))/1000);last=now;
    const reduce=false;
    rigs.forEach(r=>{
      if(!r.root.isConnected){rigs.delete(r);return;}
      const t=now/1000;
      r.ta=lerp(r.ta,r.talk?1:0,dt*9);
      /* mulut: sinkron "suku kata" acak agar natural */
      if(r.talk){
        if(now>r.nextM){
          const p=Math.random();
          r.tgt=p<.12?0:p<.35?rnd(.18,.4):p<.7?rnd(.45,.75):rnd(.75,1);
          r.tw=p<.15?rnd(.72,.82):rnd(.9,1.1);
          r.nextM=now+rnd(75,165);
        }
      }else{r.tgt=0;r.tw=1;}
      r.open=lerp(r.open,r.tgt,dt*(r.tgt>r.open?20:14));
      r.w=lerp(r.w,r.tw,dt*14);
      if(r.open>.045){
        const m=mouthD(r.open,r.w);
        r.mG.style.display='';
        r.mShape.setAttribute('d',m.shape);r.mClip.setAttribute('d',m.shape);r.mHide.setAttribute('d',m.hide);r.mTeeth.setAttribute('d',m.teeth);
        r.mTeeth.style.opacity=r.open>.4?1:0;
        r.mTongue.setAttribute('cx',CX);r.mTongue.setAttribute('cy',m.tongueY.toFixed(1));
      }else r.mG.style.display='none';
      /* kedip */
      if(r.blinkT<0&&now>r.nextBlink){r.blinkT=now;}
      let s=1;
      if(r.blinkT>=0){
        const p=(now-r.blinkT)/150;
        if(p>=1){r.blinkT=-1;r.nextBlink=now+(r.dbl?rnd(120,220):rnd(2200,5200));if(r.dbl){r.dbl=false;}else if(Math.random()<.2){r.dbl=true;}}
        else s=1-Math.sin(p*Math.PI)*.94;
      }
      /* arah pandang */
      if(now>r.nextLook){r.tlx=rnd(-4,4);r.tly=rnd(-2.5,2);if(Math.random()<.45){r.tlx=0;r.tly=0;}r.nextLook=now+rnd(1400,3600);}
      r.lx=lerp(r.lx,r.tlx,dt*12);r.ly=lerp(r.ly,r.tly,dt*12);
      r.eye.forEach((e,i)=>{const c=EYES[i];e.setAttribute('transform',`translate(${(c[0]+r.lx).toFixed(2)} ${(c[1]+r.ly).toFixed(2)}) scale(1 ${s.toFixed(3)})`);});
      /* kepala */
      const hs=Math.sin(t*2.4+r.ph);
      const ha=.8*Math.sin(t*.9+r.ph)+r.ta*(.5*Math.sin(t*5.6)+.25*Math.sin(t*3.1));
      const hy=1.2*Math.sin(t*1.7+r.ph)+r.ta*1.6*Math.sin(t*5.6+1.2);
      const hx=.9*Math.sin(t*.7+r.ph*2);
      r.head.style.transform=`translate(${hx.toFixed(2)}px,${hy.toFixed(2)}px) rotate(${ha.toFixed(2)}deg)`;
      /* napas / badan */
      const br=Math.sin(t*1.9+r.ph);
      r.all.style.transform=`translateY(${(br*-1.4).toFixed(2)}px) scale(${(1+br*.0035).toFixed(4)},${(1+br*.005).toFixed(4)})`;
      /* lengan */
      const P=POSES[r.pose]||POSES.idle;
      let tL=P.L,tR=P.R;
      if(P.waveR)tR+=7*Math.sin((now-r.pT)/1000*Math.PI*2*1.9);
      if(P.pump){const w=Math.sin((now-r.pT)/1000*Math.PI*2*1.6);tL+=4*w;tR-=4*w;}
      if(P.bounce){const w=Math.abs(Math.sin((now-r.pT)/1000*Math.PI*2*1.1));tL+=3*w;tR-=3*w;}
      tL+=1.4*Math.sin(t*1.3+r.ph)+r.ta*(2.4*Math.sin(t*3.3)+1.1*Math.sin(t*5.1));
      tR+=-1.4*Math.sin(t*1.1+r.ph+1)+r.ta*(2.4*Math.sin(t*2.9+1.7)+1.1*Math.sin(t*4.7));
      r.aL=lerp(r.aL,tL,dt*7);r.aR=lerp(r.aR,tR,dt*7);
      r.armL.style.transform=`rotate(${r.aL.toFixed(2)}deg)`;
      r.armR.style.transform=`rotate(${r.aR.toFixed(2)}deg)`;
    });
    if(rigs.size)requestAnimationFrame(tick);else running=false;
  }
  return{html,rig,avatar:'data:image/webp;base64,'+D.avatar.b64};
})();

/* =========================================================
   1. AUDIO SYNTHESIZER (WebAudio Murni - Tanpa File Eksternal)
   ========================================================= */
const AudioSys=(()=>{
  let ctx=null,master,mus,sfx,on=true,mood='menu',step=0,timer=null,lastBlip=0;
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  const MOODS={
    menu:{bpm:108,ch:[[48,[60,64,67,72]],[45,[57,60,64,69]],[41,[57,60,65,69]],[43,[59,62,67,71]]],arp:[0,1,2,3,2,1,2,3]},
    play:{bpm:116,ch:[[48,[64,67,71,72]],[50,[62,65,69,74]],[45,[60,64,69,72]],[43,[62,67,71,74]]],arp:[0,2,1,3,2,3,1,2]},
    win:{bpm:124,ch:[[48,[64,67,72,76]],[43,[62,67,71,74]],[45,[60,64,69,72]],[41,[60,65,69,72]]],arp:[0,1,2,3,3,2,1,0]}
  };
  function init(){
    if(ctx){ctx.resume&&ctx.resume();return;}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    try{ctx=new AC();}catch(e){return;}
    master=ctx.createGain();master.gain.value=.85;master.connect(ctx.destination);
    mus=ctx.createGain();mus.gain.value=on?.45:0;mus.connect(master);
    sfx=ctx.createGain();sfx.gain.value=.9;sfx.connect(master);
    timer=setInterval(sched,210);
  }
  function tone(f,dur,o={}){
    if(!ctx)return;
    const t=ctx.currentTime+(o.delay||0);
    const osc=ctx.createOscillator(),g=ctx.createGain();
    osc.type=o.type||'sine';osc.frequency.setValueAtTime(f,t);
    if(o.to)osc.frequency.exponentialRampToValueAtTime(o.to,t+dur);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(o.v||.12,t+(o.a||.008));
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    osc.connect(g);g.connect(o.dest||sfx);
    osc.start(t);osc.stop(t+dur+.03);
  }
  function noise(dur,v,freq=1600,type='bandpass'){
    if(!ctx)return;
    const len=Math.max(1,Math.floor(ctx.sampleRate*dur));
    const buf=ctx.createBuffer(1,len,ctx.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const src=ctx.createBufferSource();src.buffer=buf;
    const flt=ctx.createBiquadFilter();flt.type=type;flt.frequency.value=freq;
    const g=ctx.createGain(),t=ctx.currentTime;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    src.connect(flt);flt.connect(g);g.connect(sfx);
    src.start(t);src.stop(t+dur+.02);
  }
  function sched(){
    if(!ctx||ctx.state!=='running'||!on)return;
    const M=MOODS[mood]||MOODS.menu;
    const bar=Math.floor(step/8)%M.ch.length;
    const c=M.ch[bar];
    if(step%4===0)tone(mtof(c[0]),.26,{type:'triangle',v:.08,dest:mus});
    const a=M.arp[step%8];
    if(a>=0)tone(mtof(c[1][a%c[1].length]),.18,{type:'sine',v:.045,dest:mus});
    step++;
  }
  const S={
    tap(){tone(780,.05,{v:.07});},
    pop(){tone(440,.11,{to:920,v:.12});},
    slice(){noise(.16,.22,2200,'bandpass');tone(920,.14,{to:260,v:.14,type:'triangle'});},
    squish(){noise(.12,.14,900,'lowpass');tone(320,.1,{to:180,v:.1});},
    wrap(){noise(.28,.16,3200,'highpass');tone(520,.15,{to:780,v:.08});},
    beep(){tone(2200,.08,{type:'square',v:.08});},
    good(){[72,76,79,84].forEach((m,i)=>tone(mtof(m),.32,{type:'triangle',v:.09,delay:i*.08}));},
    err(){tone(220,.16,{type:'sawtooth',v:.12});tone(165,.24,{type:'sawtooth',v:.12,delay:.14});},
    win(){[60,64,67,72,76,79,84].forEach((m,i)=>tone(mtof(m),.38,{type:'triangle',v:.1,delay:i*.09}));},
    blip(base=640){
      if(!ctx)return;const now=performance.now();if(now-lastBlip<52)return;lastBlip=now;
      tone(base*(.95+Math.random()*.12),.035,{v:.022});
    }
  };
  return{
    init,S,
    setMood(m){mood=m;},
    resume(){if(ctx&&ctx.state!=='running'&&ctx.resume)ctx.resume();},
    toggle(){on=!on;if(ctx)mus.gain.setTargetAtTime(on?.45:0,ctx.currentTime,.1);return on;}
  };
})();

/* Scene 2: Area Dalam Kasir Indogrosir (Berdasarkan Referensi Kasir) */
function bgCashierSVG(){
  return `<svg viewBox="0 0 720 1280" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <!-- Atap Rangka Baja Gudang/Toko -->
    <rect width="720" height="440" fill="#94A3B8"/>
    ${Array.from({length:9},(_,i)=>`<line x1="${i*90}" y1="0" x2="${360+(i-4)*45}" y2="380" stroke="#64748B" stroke-width="8"/><rect x="${40+i*80}" y="${60+(i%2)*50}" width="55" height="10" rx="5" fill="#FFFBEB"/>`).join('')}
    <rect x="0" y="360" width="720" height="220" fill="#CBD5E1"/>
    <!-- Deretan Lightbox Nomor Kasir Menggantung -->
    ${[45,145,245,345,445,545,635].map((x,i)=>{
      const isY=i>=4;
      return `<line x1="${x+32}" y1="240" x2="${x+32}" y2="395" stroke="#475569" stroke-width="4"/>
      <rect x="${x}" y="395" width="64" height="48" rx="6" fill="#fff" stroke="#1E293B" stroke-width="3"/>
      <rect x="${x+3}" y="423" width="58" height="17" rx="3" fill="${isY?'#EAB308':'#005CAB'}"/>
      <text x="${x+32}" y="416" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="16" fill="#1E293B">KASIR ${i+1}</text>`;
    }).join('')}
    <!-- Lantai Abu-abu Terang -->
    <rect x="0" y="560" width="720" height="720" fill="#D6DCE5"/>
    <!-- Lorong & Meja Kasir + Rak Display Depan -->
    ${[25,185,345,515].map((x,i)=>`
      <g transform="translate(${x},520)">
        <!-- Meja Kasir -->
        <rect x="35" y="30" width="95" height="130" rx="8" fill="${i%2?'#FACC15':'#005CAB'}" stroke="#1E293B" stroke-width="3"/>
        <rect x="50" y="0" width="42" height="32" rx="4" fill="#1E293B"/>

const POSES={
  idle:{L:[8,-6],R:[8,-6]},
  wave:{L:[10,-8],R:[145,36],open:'R'},
  present:{L:[8,-6],R:[24,54],open:'R'},
  hip:{L:[38,-65],R:[38,-65]},
  pump:{L:[10,-8],R:[26,152]},
  cheer:{L:[76,118],R:[26,154],open:'both'},
  warn:{L:[38,-65],R:[110,40],open:'R'}
};
const EXPS={
  neutral:{b:'n',e:'n',m:'smile'},
  happy:{b:'up',e:'h',m:'grin'},
  joy:{b:'up',e:'n',m:'grin'},
  warn:{b:'warn',e:'w',m:'warn'}
};

class RigCtrl{
  constructor(svg){
    this.svg=svg;
    this.q={
      armL:[...svg.querySelectorAll('.armL')],
      armR:[...svg.querySelectorAll('.armR')],
      foreL:[...svg.querySelectorAll('.armL .fore')],
      foreR:[...svg.querySelectorAll('.armR .fore')]
    };
    this.exp('neutral');this.pose('idle');
  }
  setV(grp,v){this.svg.querySelectorAll(`.vg.${grp}>g`).forEach(g=>g.classList.toggle('on',g.dataset.v===v));}
  exp(name){
    const E=EXPS[name]||EXPS.neutral;
    this.setV('brows',E.b);this.setV('eyev',E.e);this.setV('mouth',E.m);
    return this;
  }
  pose(name){
    const P=POSES[name]||POSES.idle;
    this.q.armL.forEach(e=>e.style.transform=`rotate(${P.L[0]}deg)`);
    this.q.foreL.forEach(e=>e.style.transform=`rotate(${P.L[1]}deg)`);
    this.q.armR.forEach(e=>e.style.transform=`rotate(${P.R[0]}deg)`);
    this.q.foreR.forEach(e=>e.style.transform=`rotate(${P.R[1]}deg)`);
    this.q.armL.forEach(e=>e.classList.toggle('openH',P.open==='L'||P.open==='both'));
    this.q.armR.forEach(e=>e.classList.toggle('openH',P.open==='R'||P.open==='both'));
    this.svg.dataset.pose=name;
    return this;
  }
  talk(on){this.svg.classList.toggle('talking',!!on);return this;}
}

function headAvSVG(key,exp='neutral'){if(key==='rosi')return `<img alt="Rosi" src="${ROSI_AV}">`;
  const d=document.createElement('div');
  d.innerHTML=rigSVG(key,false);
  const r=new RigCtrl(d.firstChild);r.exp(exp);
  const s=d.firstChild;
  s.setAttribute('viewBox','96 8 175 180');
  s.querySelectorAll('.arm,.legs').forEach(e=>e.remove());
  return d.innerHTML;
}

/* Responsif untuk Mobile, Tablet & Iframe LMS */
const inFrame=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();
let baseH=0;
function fit(){
  const app=$('#app');
  const ae=document.activeElement,typing=!!(ae&&ae.tagName==='INPUT');
  let H=Math.max(inFrame?600:480,window.innerHeight);
  if(typing&&baseH)H=baseH;else baseH=H;
  app.style.height=H+'px';
  try{if(window.frameElement){window.frameElement.style.height=H+'px';window.frameElement.style.minHeight=H+'px';}}catch(e){}
  const W=app.clientWidth||window.innerWidth;
  SCALE=Math.min(W/720,H/1280);
  stage.style.transform=`translate(-50%,-50%) scale(${SCALE})`;
  stage.classList.toggle('framed',(W-720*SCALE>12)||(H-1280*SCALE>12));
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,250));
addEventListener('focusout',()=>setTimeout(()=>{fit();try{window.scrollTo(0,0);}catch(e){}},200));

async function transitionTo(sceneKey,title,sub,blur=false){

  wipeEl.innerHTML=`<div style="text-align:center;padding:30px">

/* Sistem Aktor */
const cast={};
const SLOTS={
  C:{left:145,top:245,w:430},
  L:{left:-25,top:270,w:395},
  R:{left:345,top:270,w:395}
};
class Actor{
  constructor(id,look,slot='C',apron=false){
    this.id=id;this.look=look;
    this.sprite=look==='rosi';this.el=h('div','actor',this.sprite?CHR.html():rigSVG(look,apron),L_act);
    this.rig=this.sprite?CHR.rig(this.el.firstChild):new RigCtrl(this.el.firstChild);
    this.place(slot);
    cast[id]=this;
  }
  place(slot){
    const s=typeof slot==='string'?SLOTS[slot]:slot;
    if(this.sprite){const q=(typeof slot==='string'&&{C:{left:90,w:540},L:{left:0,w:500},R:{left:220,w:500}}[slot])||s;Object.assign(this.el.style,{left:q.left+'px',width:q.w+'px',top:'auto',bottom:'-30px'});}else Object.assign(this.el.style,{left:s.left+'px',top:s.top+'px',width:s.w+'px'});
    return this;
  }
  exp(e){this.rig.exp(e);return this;}
  pose(p){this.rig.pose(p);return this;}
  async enter(dir='right'){
    const dx=dir==='left'?-520:520;
    this.el.firstChild.classList.add('walking');
    await anim(this.el,[{transform:`translateX(${dx}px)`,opacity:0},{transform:'translateX(0)',opacity:1}],{duration:680});
    this.el.firstChild.classList.remove('walking');
  }
  async leave(dir='left'){
    const dx=dir==='left'?-520:520;
    this.el.firstChild.classList.add('walking');
    await anim(this.el,[{transform:'translateX(0)',opacity:1},{transform:`translateX(${dx}px)`,opacity:0}],{duration:560});
    this.remove();
  }
  remove(){this.el.remove();if(cast[this.id]===this)delete cast[this.id];}
}

async function say(who,text,o={}){
  const isRosi=who==='rosi';
  const A=cast[who];
  if(A){if(o.e)A.exp(o.e);if(o.p)A.pose(o.p);}
  Object.entries(cast).forEach(([k,a])=>a.el.classList.toggle('dim',k!==who&&Object.keys(cast).length>1));

  if(dlgEl)dlgEl.remove();
  const nm=isRosi?'Rosi':`${STATE.hon} ${STATE.name}`;
  const role=isRosi?'Host Perishable':'Peserta Training';
  const col=isRosi?'#005CAB':'#E31E24';
  const avKey=isRosi?'rosi':STATE.gender;

  dlgEl=h('div','dlg',`
    <div class="tag" style="--c:${col}">
      <span class="av">${headAvSVG(avKey,o.e||'neutral')}</span>
      <span>${nm}</span><em>${role}</em>
    </div>
    <div class="txt">${text}</div>
    <span class="next">TAP ▶</span>
  `,$('#dlgLayer'));
  anim(dlgEl,[{opacity:0,transform:'translateY(30px) scale(.96)'},{opacity:1,transform:'none'}],{duration:320});

  const txtEl=dlgEl.querySelector('.txt');
  const walk=n=>{[...n.childNodes].forEach(c=>{
    if(c.nodeType===3){
      const f=document.createDocumentFragment();
      for(const ch of c.textContent){const s=document.createElement('span');s.className='ch';s.textContent=ch;f.appendChild(s);}
      c.replaceWith(f);
    }else walk(c);
  });};
  walk(txtEl);
  const spans=[...txtEl.querySelectorAll('.ch')];

  let idx=0,done=false,tmr=null;
  if(A)A.rig.talk(true);
  const step=()=>{
    if(idx>=spans.length){done=true;if(A)A.rig.talk(false);dlgEl.querySelector('.next').classList.add('show');return;}
    spans[idx].classList.add('on');
    if(idx%2===0&&spans[idx].textContent.trim())SFX.blip(isRosi?680:540);
    idx++;
    tmr=setTimeout(step,20);
  };
  step();

  await new Promise(res=>{
    tapWait=()=>{
      if(!done){clearTimeout(tmr);spans.forEach(s=>s.classList.add('on'));done=true;if(A)A.rig.talk(false);dlgEl.querySelector('.next').classList.add('show');return;}
      tapWait=null;SFX.tap();res();
    };
  });
}

  if(!dlgEl)return;
  const el=dlgEl;dlgEl=null;
  await anim(el,[{opacity:1},{opacity:0,transform:'translateY(24px)'}],{duration:220});
  el.remove();
}

/* Mekanisme Interaksi Pemotongan dengan Garis Panduan (Slice / Swipe) */
function waitGuidedSlice(boardEl,x1,y1,x2,y2,juiceCol){
  return new Promise(res=>{
    const svg=hs('guideSvg',boardEl);
    svg.setAttribute('viewBox','0 0 652 520');
    svg.innerHTML=`
      <line class="guideLine" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>
      <circle class="guideStart" cx="${x1}" cy="${y1}" r="18" fill="#E31E24" stroke="#fff" stroke-width="4"/>
      <circle class="guideEnd" cx="${x2}" cy="${y2}" r="16" fill="#FFC928" stroke="#fff" stroke-width="4"/>
    `;
    const hand=h('div','guideHand','🔪',boardEl);
    hand.style.fontSize='46px';
    const animH=hand.animate([{left:(x1-20)+'px',top:(y1-20)+'px'},{left:(x2-20)+'px',top:(y2-20)+'px'}],{duration:1350,iterations:Infinity});

    const trailSvg=hs('slashTrail',boardEl);
    trailSvg.setAttribute('viewBox','0 0 652 520');
    const poly=document.createElementNS('http://www.w3.org/2000/svg','polyline');
    poly.setAttribute('fill','none');poly.setAttribute('stroke','#FFFFFF');poly.setAttribute('stroke-width','10');poly.setAttribute('stroke-linecap','round');
    trailSvg.appendChild(poly);

    let dragging=false,pts=[];
    const localPt=e=>{
      const r=boardEl.getBoundingClientRect();
      return {x:(e.clientX-r.left)/SCALE,y:(e.clientY-r.top)/SCALE};
    };

    const onDown=e=>{e.preventDefault();
      const p=localPt(e);
      if(Math.hypot(p.x-x1,p.y-y1)<85||Math.hypot(p.x-x2,p.y-y2)<85){
        dragging=true;pts=[p];
        poly.setAttribute('points',`${p.x},${p.y}`);
      }
    };
    const onMove=e=>{
      if(!dragging)return;
      const p=localPt(e);pts.push(p);
      poly.setAttribute('points',pts.map(q=>`${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(' '));
      const dStart=Math.hypot(pts[0].x-x1,pts[0].y-y1)<90?Math.hypot(p.x-x2,p.y-y2):Math.hypot(p.x-x1,p.y-y1);
      if(dStart<80){
        finishSlice();
      }
    };
    const onUp=()=>{
      if(!dragging)return;
      dragging=false;pts=[];poly.setAttribute('points','');
    };

    function finishSlice(){
      dragging=false;
      boardEl.removeEventListener('pointerdown',onDown);
      window.removeEventListener('pointermove',onMove);
      window.removeEventListener('pointerup',onUp);window.removeEventListener('pointercancel',onUp);
      animH.cancel();hand.remove();svg.remove();
      SFX.slice();
      spawnJuice((x1+x2)/2+34,(y1+y2)/2+460,juiceCol);
      setTimeout(()=>trailSvg.remove(),220);
      res();
    }

    boardEl.addEventListener('pointerdown',onDown);window.addEventListener('pointercancel',onUp);
    window.addEventListener('pointermove',onMove);
    window.addEventListener('pointerup',onUp);
  });
}

/* Mekanisme Drag & Drop Elemen */
function makeDraggable(el,targetEl,onSuccess,onInvalid){
  el.classList.add('draggable');el.style.touchAction='none';
  const down=e=>{
    e.preventDefault();SFX.tap();
    const r0=el.getBoundingClientRect(),k=r0.width/Math.max(1,el.offsetWidth);
    const proxy=el.cloneNode(true);
    proxy.removeAttribute('id');proxy.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
    proxy.className='dragProxy';
    Object.assign(proxy.style,{position:'fixed',margin:'0',width:el.offsetWidth+'px',height:el.offsetHeight+'px',opacity:'1',transformOrigin:'50% 50%',transform:`translate(-50%,-50%) scale(${(k*1.05).toFixed(3)})`,left:e.clientX+'px',top:e.clientY+'px'});
    document.body.appendChild(proxy);el.style.visibility='hidden';
    const sx=e.clientX,sy=e.clientY;let moved=0;
    const move=ev=>{proxy.style.left=ev.clientX+'px';proxy.style.top=ev.clientY+'px';moved=Math.max(moved,Math.hypot(ev.clientX-sx,ev.clientY-sy));};
    const end=ev=>{
      window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',end);window.removeEventListener('pointercancel',cancel);
      proxy.remove();el.style.visibility='';
      const r=targetEl.getBoundingClientRect(),m=50;
      if(ev&&ev.clientX>=r.left-m&&ev.clientX<=r.right+m&&ev.clientY>=r.top-m&&ev.clientY<=r.bottom+m){
        el.removeEventListener('pointerdown',down);el.classList.remove('draggable');onSuccess();
      }else if(onInvalid&&moved>12){onInvalid();}
    };
    const cancel=()=>end(null);
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',end);window.addEventListener('pointercancel',cancel);
  };
  el.addEventListener('pointerdown',down);
}

/* =========================================================
   10. ALUR 6 — TAHAP 2: AREA BUTCHER (PEMOTONGAN AYAM 5 PERCOBAAN ACAK)
   ========================================================= */
/* Panduan Anatomi Pemotongan Karkas Ayam (6, 8, 10, dan 12 Bagian)
   Koordinat garis dihitung dari foto "Ayam Karkas" (615x615) lalu dipetakan ke papan 652x520. */
const CH_S=520/615,CH_OX=66;
const cx=v=>Math.round(CH_OX+v*CH_S),cy=v=>Math.round(v*CH_S);
const CL=(label,id,a,b,c,d)=>({label,id,x1:cx(a),y1:cy(b),x2:cx(c),y2:cy(d)});
const ST_WL=CL('Lepas Sayap Kiri dari badan','c_wl',150,115,215,265);
const ST_WR=CL('Lepas Sayap Kanan dari badan','c_wr',475,115,410,265);
const ST_MID=CL('Belah Tengah Karkas (kiri & kanan)','c_mid',310,80,310,485);
const ST_WAIST=CL('Pisahkan Dada dari Paha','c_waist',140,330,485,330);
const ST_LGL=CL('Pisahkan Paha Atas & Bawah Kiri','c_legL',125,415,235,415);
const ST_LGR=CL('Pisahkan Paha Atas & Bawah Kanan','c_legR',490,415,385,415);
const ST_B1=CL('Bagi Dada Kiri & Kanan menjadi 2 bagian','c_b1',190,215,435,215);
const ST_B2=CL('Bagi Dada: potongan tengah (1/3 atas)','c_b2',190,175,435,175);
const ST_B3=CL('Bagi Dada: potongan bawah (2/3)','c_b3',190,255,435,255);
const CHICKEN_SPECS={
  6:{parts:6,title:'Potongan 6 Bagian',
    desc:'Lepas 2 sayap, belah tengah karkas, lalu pisahkan dada dari paha utuh.',
    steps:[ST_WL,ST_WR,ST_MID,ST_WAIST],
    chips:[['Sayap',2],['Dada',2],['Paha Utuh',2]],
    cap:'Potongan 6 bagian: 2 sayap, 2 dada, dan 2 paha (paha atas + paha bawah masih menyatu).'},
  8:{parts:8,title:'Potongan 8 Bagian (Standar)',
    desc:'Standar populer: lepas sayap, belah tengah, pisahkan dada & paha, lalu paha atas & bawah.',
    steps:[ST_WL,ST_WR,ST_MID,ST_WAIST,ST_LGL,ST_LGR],
    chips:[['Sayap',2],['Dada',2],['Paha Atas',2],['Paha Bawah',2]],
    cap:'Potongan 8 bagian: 2 sayap, 2 dada, 2 paha atas (thigh), dan 2 paha bawah (drumstick).'},
  10:{parts:10,title:'Potongan 10 Bagian',
    desc:'Seperti potongan 8, dengan tambahan dada kiri & kanan masing-masing dibagi 2.',
    steps:[ST_WL,ST_WR,ST_MID,ST_WAIST,ST_LGL,ST_LGR,ST_B1],
    chips:[['Sayap',2],['Dada',4],['Paha Atas',2],['Paha Bawah',2]],
    cap:'Potongan 10 bagian: 2 sayap, 4 dada (tiap sisi dibagi 2), 2 paha atas, dan 2 paha bawah.'},
  12:{parts:12,title:'Potongan 12 Bagian (Keluarga)',
    desc:'Seperti potongan 8, dengan tambahan dada kiri & kanan masing-masing dibagi 3.',
    steps:[ST_WL,ST_WR,ST_MID,ST_WAIST,ST_LGL,ST_LGR,ST_B2,ST_B3],
    chips:[['Sayap',2],['Dada',6],['Paha Atas',2],['Paha Bawah',2]],
    cap:'Potongan 12 bagian: 2 sayap, 6 dada (tiap sisi dibagi 3), 2 paha atas, dan 2 paha bawah.'}
};

function renderWholeChickenSVG(doneSteps){
  /* Foto Ayam Karkas di atas talenan bundar + garis irisan merah untuk potongan yang sudah selesai */
  return `<img class="chImg" src="${IMG_KARKAS}" alt="Ayam Karkas" draggable="false">
  <svg viewBox="0 0 652 520" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none">
    <g stroke="#E31E24" stroke-width="6" stroke-linecap="round" style="filter:drop-shadow(0 0 3px #fff)">
      ${doneSteps.map(s=>`<line x1="${s.x1}" y1="${s.y1}" x2="${s.x2}" y2="${s.y2}"/>`).join('')}
    </g></svg>`;
}

/* Gesek pisau di sepanjang garis panduan (khusus ayam): mulai dari salah satu ujung,
   selesai bila jari mencapai ujung satunya setelah menempuh sebagian besar garis. */
function waitChickenSlice(boardEl,x1,y1,x2,y2){
  return new Promise(res=>{
    const svg=hs('guideSvg',boardEl);svg.setAttribute('viewBox','0 0 652 520');
    svg.innerHTML=`<line class="guideLine" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>
      <circle cx="${x1}" cy="${y1}" r="18" fill="#E31E24" stroke="#fff" stroke-width="4"/>
      <circle cx="${x2}" cy="${y2}" r="16" fill="#FFC928" stroke="#fff" stroke-width="4"/>`;
    const hand=h('div','guideHand','🔪',boardEl);hand.style.fontSize='46px';
    const animH=hand.animate([{left:(x1-20)+'px',top:(y1-20)+'px'},{left:(x2-20)+'px',top:(y2-20)+'px'}],{duration:1350,iterations:Infinity});
    const trail=hs('slashTrail',boardEl);trail.setAttribute('viewBox','0 0 652 520');
    const poly=document.createElementNS('http://www.w3.org/2000/svg','polyline');
    poly.setAttribute('fill','none');poly.setAttribute('stroke','#FFFFFF');poly.setAttribute('stroke-width','10');poly.setAttribute('stroke-linecap','round');
    trail.appendChild(poly);

    const len=Math.hypot(x2-x1,y2-y1),R_START=75,R_END=Math.min(60,len*.28);
    let dragging=false,pid=null,from=null,pts=[];
    const lp=e=>{const r=boardEl.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*652,y:(e.clientY-r.top)/r.height*520};};
    const near=(p,x,y,r)=>Math.hypot(p.x-x,p.y-y)<=r;
    const onDown=e=>{
      e.preventDefault();
      const p=lp(e);
      if(near(p,x1,y1,R_START))from=1;else if(near(p,x2,y2,R_START))from=2;else return;
      dragging=true;pid=e.pointerId;pts=[p];poly.setAttribute('points',`${p.x},${p.y}`);
    };
    const onMove=e=>{
      if(!dragging||e.pointerId!==pid)return;
      const p=lp(e);pts.push(p);
      poly.setAttribute('points',pts.map(q=>`${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(' '));
      const tx=from===1?x2:x1,ty=from===1?y2:y1,sx=from===1?x1:x2,sy=from===1?y1:y2;
      if(near(p,tx,ty,R_END)){
        /* sudah menempuh sebagian besar garis (proyeksi jarak dari titik awal) */
        const ux=(tx-sx)/len,uy=(ty-sy)/len;
        if((p.x-sx)*ux+(p.y-sy)*uy>=len*.7)finish();
      }
    };
    const onUp=e=>{if(!dragging||(e&&e.pointerId!==pid))return;dragging=false;pts=[];poly.setAttribute('points','');};
    function finish(){
      dragging=false;
      boardEl.removeEventListener('pointerdown',onDown);
      window.removeEventListener('pointermove',onMove);
      window.removeEventListener('pointerup',onUp);window.removeEventListener('pointercancel',onUp);
      animH.cancel();hand.remove();svg.remove();
      SFX.slice();
      spawnJuice((x1+x2)/2+34,(y1+y2)/2+460,'#FCA5A5');
      setTimeout(()=>trail.remove(),220);
      res();
    }
    boardEl.addEventListener('pointerdown',onDown);
    window.addEventListener('pointermove',onMove);
    window.addEventListener('pointerup',onUp);window.addEventListener('pointercancel',onUp);
  });
}

/* Layar hasil: foto potongan + keterangan + pop-up "Saya Paham!!" (wajib diklik) */
function showCutResult(spec){
  return new Promise(res=>{
    const ov=h('div','resOv',`
      <div class="resCard">
        <div class="resTag">🍗 Hasil ${spec.title}</div>
        <div class="resImg"><img src="${IMG_CUT[spec.parts]}" alt="${spec.title}" draggable="false"></div>
        <div class="resCap">
          <div class="resChips">${spec.chips.map(c=>`<span><b>${c[1]}×</b> ${c[0]}</span>`).join('')}</div>
          <p>${spec.cap}</p>
        </div>
        <button class="resBtn" type="button">Saya Paham!!</button>
      </div>`,L_ws);
    anim(ov,[{opacity:0},{opacity:1}],{duration:280});
    anim(ov.firstElementChild,[{opacity:0,transform:'translateY(40px) scale(.92)'},{opacity:1,transform:'none'}],{duration:420,easing:'cubic-bezier(.34,1.56,.64,1)'});
    let done=false;
    ov.querySelector('.resBtn').onclick=async()=>{
      if(done)return;done=true;SFX.good();
      await anim(ov,[{opacity:1},{opacity:0}],{duration:240});
      ov.remove();res();
    };
  });
}

async function playOneChickenRound(cutType,roundIdx,totalRounds){
  const spec=CHICKEN_SPECS[cutType];
  updateHUD(spec.title,'BUTCHER',totalRounds,roundIdx);
  L_ws.innerHTML='';L_ws.classList.add('active');

  const ws=h('div','wsWrap',`
    <div class="wsBench"></div>
    <div class="cutGuideBar">
      <div class="cutTargetBadge">
        <small>PERCOBAAN ${roundIdx+1}/${totalRounds}</small>
        <b>${spec.parts}</b>
        <span>POTONG</span>
      </div>
      <div class="cutRules">
        <h4>Standar ${spec.title}</h4>
        <p>${spec.desc}</p>
        <div class="cutStepList" id="cStepPills">
          ${spec.steps.map((s,i)=>`<span class="cutStepPill ${i===0?'cur':''}">${i+1}</span>`).join('')}
        </div>
      </div>
    </div>
    <div class="boardArea" id="butcherBoard">
      <div class="boardGroove"></div>
      <span class="boardBadge">TALENAN AYAM</span>
      <span class="stepCounter" id="bStepCnt">Irisan 1/${spec.steps.length}</span>
      <div id="chickenWrap" style="position:absolute;inset:0"></div>
    </div>
  `,L_ws);

  const board=ws.querySelector('#butcherBoard');
  const wrap=ws.querySelector('#chickenWrap');
  const pills=ws.querySelectorAll('.cutStepPill');
  const cnt=ws.querySelector('#bStepCnt');
  const done=[];const curLbl=h('div','curLbl','',ws.querySelector('.cutRules'));

  for(let i=0;i<spec.steps.length;i++){
    const st=spec.steps[i];
    cnt.textContent=`Irisan ${i+1}/${spec.steps.length}`;curLbl.textContent=`${i+1}. ${st.label}`;
    pills.forEach((p,pi)=>{p.classList.toggle('cur',pi===i);p.classList.toggle('done',pi<i);});
    wrap.innerHTML=renderWholeChickenSVG(done);
    instruct('Geser pisau mengikuti garis merah','🔪');
    await waitChickenSlice(board,st.x1,st.y1,st.x2,st.y2);
    done.push(st);
  }

  pills.forEach(p=>{p.classList.remove('cur');p.classList.add('done');});
  cnt.textContent=`Selesai: ${spec.parts} Potong!`;
  curLbl.textContent='Semua irisan selesai!';
  wrap.innerHTML=renderWholeChickenSVG(done);
  SFX.good();
  floatText(360,680,`Karkas Ayam ${spec.parts} Potong Sempurna! 🍗`,'#15803D');
  instruct(null);
  await sleep(900);
  await showCutResult(spec);   /* berhenti sampai peserta menekan "Saya Paham!!" */
}

async function alur6_ButcherStage(){
  await transitionTo('butcher','Tahap 2 · Area Butcher','PEMOTONGAN KARKAS AYAM',true);

  const P=new Actor('player',STATE.gender,'L',true);
  const R=new Actor('rosi','rosi','R',true);
  await Promise.all([P.enter('left'),R.enter('right')]);

  await say('rosi',`Kerja bagus di Area Buah tadi, <b class="hl">${STATE.hon} ${STATE.name}</b>! Sekarang kita masuk ke <b class="hl">Area Butcher</b> menggunakan apron putih higienis.`,{e:'happy',p:'wave'});
  await say('rosi','Di tahap ini, kamu akan melakukan <b class="hl">5 kali percobaan acak</b> memotong daging ayam utuh di atas talenan putih menjadi <b class="hl">Potongan 6, Potongan 8, Potongan 10, dan Potongan 12</b>.',{e:'joy',p:'present'});
  await say('rosi','Ikuti garis panduan anatomi sendi dan tulang dada agar hasil potongan rapi dan sesuai standar Indogrosir. Yuk kita mulai!',{e:'happy',p:'pump'});
  await closeDlg();
  await Promise.all([P.leave('left'),R.leave('right')]);

  /* Buat 5 Percobaan Acak yang Mencakup Semua Jenis Potongan (6, 8, 10, 12 + 1 acak tambahan) */
  const baseTypes=[6,8,10,12];
  const extra=baseTypes[Math.floor(Math.random()*baseTypes.length)];
  const rounds=[...baseTypes,extra];
  for(let i=rounds.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rounds[i],rounds[j]]=[rounds[j],rounds[i]];}

  for(let i=0;i<rounds.length;i++){
    await playOneChickenRound(rounds[i],i,rounds.length);
  }
  L_ws.innerHTML='';L_ws.classList.remove('active');
}
